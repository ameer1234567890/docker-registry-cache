<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registry cache</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef1f4" id="theme-color">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
  // Runs before first paint so the saved theme never flashes.
  (function () {
    var t = null;
    try { t = localStorage.getItem('registry-cache-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="/">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><rect x="5" y="7" width="14" height="8" rx="1.5" fill="#fff"/><rect x="21" y="7" width="6" height="8" rx="1.5" fill="#fff" opacity=".6"/><rect x="5" y="17" width="8" height="8" rx="1.5" fill="#fff" opacity=".6"/><rect x="15" y="17" width="12" height="8" rx="1.5" fill="#fff"/></svg>
      <span>Registry cache</span>
    </a>
    <div class="actions">
      <button class="btn" id="connect" type="button">Connect a client</button>
      <button class="btn" id="refresh" type="button">Rescan</button>
      <button class="icon-btn" id="theme" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
        <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
        <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div id="banner" class="banner" role="alert" hidden></div>
  <section class="hero" id="hero" aria-live="polite"></section>
  <section class="strip-wrap" id="strip"></section>

  <div class="layout">
    <nav class="rail" id="rail" aria-label="Registries"></nav>
    <main class="main">
      <div class="toolbar">
        <input id="q" type="search" placeholder="Filter by image or tag" aria-label="Filter by image or tag" autocomplete="off">
        <span class="count" id="count"></span>
        <button class="btn danger-outline" id="bulk" type="button" hidden></button>
      </div>
      <div class="table-wrap" id="table"></div>
    </main>
  </div>

  <footer class="foot" id="foot"></footer>
</div>

<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<dialog id="info" aria-labelledby="info-title"></dialog>
<dialog id="confirm" aria-labelledby="confirm-title"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/app.js" defer></script>
</body>
</html>
