# One line per registry:   id | display name | upstream URL
#
# Clients keep using the upstream's own name, so the HOSTNAME in the URL is what
# nginx routes on and what your certificate must cover. No port, no path.
# The id is only a label and the name of the folder under ./data.
#
# After editing:  docker compose up -d --force-recreate
# Then (re)point DNS at the cache for any hostname you add. See README.
hub|Docker Hub|https://registry-1.docker.io
ghcr|GitHub Container Registry|https://ghcr.io
quay|Quay|https://quay.io
gcr|Google Container Registry|https://gcr.io
k8s|Kubernetes registry|https://registry.k8s.io
mcr|Microsoft Container Registry|https://mcr.microsoft.com
