# Friendly names for the client addresses shown in each image's pull history.
#   ip | name
#
# The address is whatever the cache sees as the source of a request. Behind Docker Desktop, a NAT or
# another proxy that can be the device in front of the client rather than the client itself.
# Takes effect on the next scan; no restart needed.
#
# 192.168.1.20|dev-laptop-anna
# 192.168.1.31|k8s-node-3
